<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelf">
<meta name="theme-color" content="#F6F1E7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>書櫃 Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<style>
/* Layout: library of covers on a warm paper ground; reader is full-bleed paper with hidden chrome that appears on a centre tap. */
:root{
  --paper:#F6F1E7; --card:#FFFDF8; --ink:#1F1A14; --muted:#7A6F60; --line:#E3DACA; --accent:#B4532A; --accent2:#2F5D50; --hl:#F3D27A;
  --easy:#2E7D4F; --mid:#B7791F; --hard:#B4432A;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Noto Sans TC",-apple-system,"Hiragino Sans",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{--paper:#17140F;--card:#221E18;--ink:#EDE6D9;--muted:#A0968A;--line:#3A332A;--accent:#E07A4C;--accent2:#7FB8A6;--easy:#5CC48A;--mid:#E0AE4C;--hard:#E77B62;color-scheme:dark}}
html[lang="ja"]{--f-ui:"Hiragino Sans","Noto Sans JP",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{min-height:100%;padding:calc(18px + var(--safe-t)) max(20px,env(safe-area-inset-right)) calc(90px + var(--safe-b)) max(20px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:2.4rem;margin:0;letter-spacing:-.01em}
.top h1 span{font-family:var(--f-ui);font-size:1rem;color:var(--muted);font-weight:500;margin-left:8px}
.topr{display:flex;gap:10px;align-items:center}
.langsel{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.importbtn{color:var(--accent);font-weight:700;padding:10px 14px;border-radius:10px;border:1.5px solid var(--accent)}
.view{max-width:1100px;margin:18px auto 0}
.sect{font-size:.8rem;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.book{display:flex;flex-direction:column;gap:8px;text-align:left;position:relative}
.book>button:first-child{text-align:left;display:flex;flex-direction:column;gap:8px}
.cover{aspect-ratio:2/3;width:100%;border-radius:4px 8px 8px 4px;background:var(--line) center/cover no-repeat;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 24px -12px rgba(0,0,0,.45);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.cover.noimg{background:linear-gradient(160deg,var(--accent2),#1d3a32)}
.cover.noimg.g{background:linear-gradient(160deg,#5B4B8A,#2C2347)}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent)}
.book b{font-family:var(--f-display);font-size:1rem;line-height:1.25;font-weight:600}
.book small{color:var(--muted);font-size:.8rem}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;border:1.5px solid currentColor;white-space:nowrap}
.pill.e{color:var(--easy)}.pill.m1{color:var(--accent2)}.pill.m{color:var(--mid)}.pill.h{color:var(--hard)}.pill.src{color:var(--muted);border-width:1px;font-weight:500}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.book .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;width:30px;height:30px;border-radius:50%;font-size:1rem}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);line-height:1.8}
.continue{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%}
.continue .cover{width:84px;flex:none;font-size:.8rem}
.continue h2{font-family:var(--f-display);margin:2px 0 6px;font-size:1.5rem}
.continue p{margin:0;color:var(--muted)}
.continue .go{margin-left:auto;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;flex:none}
.searchrow{display:flex;gap:10px}
.searchrow input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.searchrow button{background:var(--ink);color:var(--paper);font-weight:700;padding:0 20px;border-radius:12px}
.filters{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;align-items:center}
.filters .lab{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.08em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:.9rem}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{color:var(--muted);font-size:.86rem;line-height:1.7;margin-top:10px}
.note a{color:var(--accent)}
.status{color:var(--muted);padding:20px 0}
.dl{margin-top:4px;background:var(--accent);color:#fff;border-radius:10px;padding:9px 10px;font-weight:700;font-size:.9rem}
.dl.done{background:var(--accent2)}
.dl[disabled]{opacity:.6}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + var(--safe-b)) max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.tabs button{padding:10px 22px;border-radius:12px;font-weight:700;color:var(--muted);position:relative}
.tabs button.on{background:var(--ink);color:var(--paper)}
.badge{position:absolute;top:2px;right:4px;background:var(--accent);color:#fff;font-size:.68rem;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translate(-50%,-200%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}

/* 生字本 */
.wtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.review{background:var(--accent);color:#fff;font-weight:700;padding:12px 20px;border-radius:12px}
.review[disabled]{opacity:.45}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .wh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wcard .w{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.wcard .ph{color:var(--muted);font-size:.85rem}
.wcard .tr{font-weight:700}
.wcard .sen{color:var(--muted);font-size:.9rem;line-height:1.55;font-family:Georgia,serif}
.wcard .sen mark{background:var(--hl);color:#1F1A14;border-radius:3px;padding:0 2px}
.wcard .wf{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.wcard .wf button{color:var(--accent);font-weight:700;padding:4px 6px}
.lvl{display:inline-flex;gap:2px}.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line)}.lvl i.on{background:var(--easy)}
.flash{max-width:560px;margin:10px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 24px;text-align:center;min-height:320px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.flash .w{font-family:var(--f-display);font-size:2.4rem;font-weight:700}
.flash .sen{font-family:Georgia,serif;color:var(--muted);line-height:1.6}
.flash .sen mark{background:var(--hl);color:#1F1A14;border-radius:3px;padding:0 2px}
.flash .ans{font-size:1.3rem;font-weight:700}
.flash .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font-weight:700;padding:13px 22px;border-radius:12px;background:var(--ink);color:var(--paper)}
.btn.ok{background:var(--easy);color:#fff}.btn.no{background:var(--hard);color:#fff}.btn.ghost{background:var(--line);color:var(--ink)}

/* 閱讀器 */
#reader{position:fixed;inset:0;z-index:20;--rbg:#FBF7EE;--rfg:#222;background:var(--rbg);color:var(--rfg)}
#reader.sepia{--rbg:#F1E5CC;--rfg:#3B2F1E}#reader.dark{--rbg:#121212;--rfg:#D9D4CA}#reader.light{--rbg:#FFFFFF;--rfg:#1A1A1A}
#viewer{position:absolute;top:calc(34px + var(--safe-t));bottom:calc(38px + var(--safe-b));left:var(--mx,40px);right:var(--mx,40px)}
.zone{position:absolute;top:calc(34px + var(--safe-t));bottom:calc(38px + var(--safe-b));width:min(9%,64px);z-index:2}
.zone.l{left:0}.zone.r{right:0}
.rmenu{position:absolute;top:calc(4px + var(--safe-t));right:8px;z-index:6;width:44px;height:44px;border-radius:22px;font-size:1.25rem;color:color-mix(in srgb,var(--rfg) 55%,transparent);background:color-mix(in srgb,var(--rbg) 70%,transparent)}
#reader.ui .rmenu{display:none}
.rinfo{position:absolute;left:0;right:0;font-size:.78rem;color:color-mix(in srgb,var(--rfg) 50%,transparent);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 60px}
.rinfo.t{top:calc(10px + var(--safe-t))}.rinfo.b{bottom:calc(12px + var(--safe-b))}
.chrome{position:absolute;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--rbg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,opacity .2s}
.chrome.top{top:0;padding:calc(8px + var(--safe-t)) 14px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid color-mix(in srgb,var(--rfg) 12%,transparent)}
.chrome.bot{bottom:0;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid color-mix(in srgb,var(--rfg) 12%,transparent)}
#reader:not(.ui) .chrome.top{transform:translateY(-110%);opacity:0;pointer-events:none}
#reader:not(.ui) .chrome.bot{transform:translateY(110%);opacity:0;pointer-events:none}
.chrome .ttl{flex:1;min-width:0;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{padding:10px 12px;border-radius:10px;font-weight:700;min-width:44px;min-height:44px}
.ib:hover{background:color-mix(in srgb,var(--rfg) 8%,transparent)}
.scrub{display:flex;align-items:center;gap:12px}
.scrub input{flex:1;accent-color:var(--accent)}
.scrub span{font-variant-numeric:tabular-nums;font-size:.85rem;min-width:44px;text-align:right}
.panel{position:absolute;z-index:6;right:12px;top:calc(64px + var(--safe-t));width:min(380px,calc(100% - 24px));max-height:calc(100% - 140px);overflow:auto;background:var(--rbg);color:var(--rfg);border:1px solid color-mix(in srgb,var(--rfg) 15%,transparent);border-radius:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);padding:16px}
.panel.left{left:12px;right:auto}
.panel h4{margin:14px 0 8px;font-size:.75rem;letter-spacing:.12em;opacity:.6}
.panel h4:first-child{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:10px 8px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--rfg) 18%,transparent);font-size:.95rem}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:6px;border:1px solid rgba(0,0,0,.2)}
.toc a{display:block;padding:10px 6px;border-bottom:1px solid color-mix(in srgb,var(--rfg) 10%,transparent);color:inherit;text-decoration:none}
.toc a.sub{padding-left:22px;font-size:.92rem;opacity:.85}
.toc a.cur{color:var(--accent);font-weight:700}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.7;z-index:1}

/* 查字卡 */
.pop{position:absolute;z-index:8;width:min(360px,calc(100% - 24px));background:var(--rbg);color:var(--rfg);border:1px solid color-mix(in srgb,var(--rfg) 18%,transparent);border-radius:16px;box-shadow:0 18px 50px -16px rgba(0,0,0,.55);padding:14px 16px;max-height:60%;overflow:auto}
.pop .ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pop .w{font-family:Georgia,serif;font-size:1.5rem;font-weight:700}
.pop .ipa{opacity:.6;font-size:.9rem}
.pop .tr{font-size:1.15rem;font-weight:700;margin:6px 0 4px}
.pop .alt{font-size:.88rem;opacity:.8;line-height:1.55}
.pop .alt b{opacity:.65;font-weight:500;margin-right:4px}
.pop .def{font-size:.88rem;line-height:1.5;margin-top:6px;opacity:.85;font-family:Georgia,serif}
.pop .sent{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--rfg) 12%,transparent);font-size:.88rem;line-height:1.55}
.pop .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pop .acts button{padding:8px 12px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--rfg) 18%,transparent);font-weight:700;font-size:.88rem}
.pop .acts .saved{border-color:var(--accent);color:var(--accent)}
.selbtn{position:absolute;z-index:8;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
@media (max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 14px}.top h1{font-size:2rem}.continue .go{display:none}.tabs button{padding:10px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1 data-t="appName">書櫃<span>Shelf</span></h1>
    <div class="topr"><select class="langsel" id="uiLang" aria-label="Language"><option value="zh">繁體中文</option><option value="ja">日本語</option><option value="en">English</option></select>
    <button class="importbtn" id="importBtn" data-t="import"></button><button class="importbtn" id="importUrlBtn" data-t="importUrl"></button><input type="file" id="fileIn" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden></div></div>

  <section class="view" id="vShelf">
    <div id="contWrap"></div>
    <div class="sect" data-t="myBooks"></div>
    <div class="grid" id="shelf"></div>
    <div class="empty" id="shelfEmpty" hidden data-t="shelfEmpty"></div>
  </section>

  <section class="view" id="vFind" hidden>
    <form class="searchrow" id="sForm"><input id="sq" type="search" autocomplete="off" autocapitalize="off" enterkeyhint="search"><button data-t="search"></button></form>
    <div class="filters">
      <span class="lab" data-t="level"></span>
      <div class="chips" id="lvChips"><button class="chip on" data-lv="all"></button><button class="chip" data-lv="e"></button><button class="chip" data-lv="m1"></button><button class="chip" data-lv="m"></button><button class="chip" data-lv="h"></button></div>
      <span class="lab" data-t="source"></span>
      <div class="chips" id="srcChips"><button class="chip on" data-src="all"></button><button class="chip" data-src="se">Standard Ebooks</button><button class="chip" data-src="pg">Gutenberg</button></div>
    </div>
    <p class="note" id="srcNote"></p>
    <div id="results" class="grid" style="margin-top:18px"></div>
    <div class="status" id="sStatus"></div>
  </section>

  <section class="view" id="vWords" hidden>
    <div class="wtools"><div class="chips" id="wlChips"><button class="chip on" data-wl="all"></button><button class="chip" data-wl="new"></button><button class="chip" data-wl="known"></button></div>
      <button class="review" id="reviewBtn"></button></div>
    <div id="flash" hidden></div>
    <div class="wlist" id="wlist"></div>
    <div class="empty" id="wordsEmpty" hidden data-t="wordsEmpty"></div>
  </section>
</div>

<nav class="tabs"><button class="on" data-v="vShelf" data-t="tabShelf"></button><button data-v="vFind" data-t="tabFind"></button><button data-v="vWords"><span data-t="tabWords"></span><span class="badge" id="dueBadge" hidden></span></button></nav>

<div id="reader" hidden>
  <div class="rinfo t" id="rTitle"></div>
  <div id="viewer"></div>
  <div class="loading" id="rLoading"></div>
  <button class="zone l" id="zl"></button>
  <button class="zone r" id="zr"></button>
  <div class="rinfo b" id="rPos"></div>
  <div class="chrome top">
    <button class="ib" id="rBack"></button>
    <button class="ib" id="rToc" data-t="toc"></button>
    <div class="ttl" id="rTtl"></div>
    <button class="ib" id="rWords" data-t="tabWords"></button>
    <button class="ib" id="rAa" style="font-family:Georgia,serif">Aa</button>
  </div>
  <button class="rmenu" id="rMenu" aria-label="menu">☰</button>
  <div class="chrome bot"><div class="scrub"><input type="range" id="rScrub" min="0" max="1000" value="0"><span id="rPct">0%</span></div></div>
  <div class="panel left toc" id="tocPanel" hidden></div>
  <div class="panel" id="aaPanel" hidden>
    <h4 data-t="fontSize"></h4>
    <div class="seg"><button id="fsDown" style="font-size:.9rem">A−</button><button id="fsVal" disabled style="opacity:1"></button><button id="fsUp" style="font-size:1.3rem">A+</button></div>
    <h4 data-t="font"></h4>
    <div class="seg" id="fontSeg">
      <button data-f="Georgia, serif" style="font-family:Georgia">Georgia</button>
      <button data-f="ui-serif, 'New York', 'Iowan Old Style', serif" style="font-family:ui-serif,'Iowan Old Style',serif">New York</button>
      <button data-f="-apple-system, 'Helvetica Neue', sans-serif" style="font-family:-apple-system,sans-serif">San Francisco</button>
      <button data-f="Verdana, 'Atkinson Hyperlegible', sans-serif" style="font-family:Verdana" data-t="legible"></button>
    </div>
    <h4 data-t="lineH"></h4>
    <div class="seg" id="lhSeg"><button data-lh="1.4" data-t="tight"></button><button data-lh="1.65" data-t="normal"></button><button data-lh="1.9" data-t="wide"></button></div>
    <h4 data-t="margin"></h4>
    <div class="seg" id="mxSeg"><button data-mx="16" data-t="narrow"></button><button data-mx="40" data-t="normal"></button><button data-mx="90" data-t="wide"></button></div>
    <h4 data-t="bg"></h4>
    <div class="seg" id="thSeg">
      <button data-th="paper"><span class="sw" style="background:#FBF7EE"></span><span data-t="thPaper"></span></button>
      <button data-th="light"><span class="sw" style="background:#fff"></span><span data-t="thLight"></span></button>
      <button data-th="sepia"><span class="sw" style="background:#F1E5CC"></span><span data-t="thSepia"></span></button>
      <button data-th="dark"><span class="sw" style="background:#121212"></span><span data-t="thDark"></span></button>
    </div>
    <h4 data-t="spread"></h4>
    <div class="seg" id="spSeg"><button data-sp="auto" data-t="spAuto"></button><button data-sp="none" data-t="spOne"></button></div>
    <h4 data-t="tapLookup"></h4>
    <div class="seg" id="tlSeg"><button data-tl="zh-TW">中文</button><button data-tl="ja">日本語</button><button data-tl="en">English</button></div>
  </div>
  <div class="pop" id="pop" hidden></div>
  <button class="selbtn" id="selBtn" hidden></button>
</div>
<div class="toast" id="toast"></div>

<script>

// ================= 難易度（Flesch Reading Ease） =================
function lvOf(score){if(score==null||isNaN(score))return null;return score>=80?"e":score>=70?"m1":score>=60?"m":"h"}
const LVK={e:"lvE",m1:"lvM1",m:"lvM",h:"lvH"};
const lvPill=s=>{const k=lvOf(s);return k?`<span class="pill ${k}" title="Flesch ${Math.round(s)}">${t(LVK[k])}</span>`:""};
function syl(w){w=w.toLowerCase().replace(/[^a-z]/g,"");if(!w)return 0;if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}
function flesch(text){const sents=text.split(/[.!?]+[\s"”’)]/).filter(s=>/[a-z]/i.test(s));const words=text.match(/[A-Za-z][A-Za-z'’-]*/g)||[];if(words.length<200||!sents.length)return null;
  let sy=0;for(const w of words)sy+=syl(w);return 206.835-1.015*(words.length/sents.length)-84.6*(sy/words.length)}

// ================= IndexedDB =================
let DBP;
function db(){return DBP||(DBP=new Promise((res,rej)=>{const r=indexedDB.open("shelf",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("books"))d.createObjectStore("books",{keyPath:"id"});if(!d.objectStoreNames.contains("files"))d.createObjectStore("files");if(!d.objectStoreNames.contains("words"))d.createObjectStore("words",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const x=d.transaction(store,mode);const r=fn(x.objectStore(store));x.oncomplete=()=>res(r&&r.result);x.onerror=()=>rej(x.error)})}
const allBooks=()=>tx("books","readonly",s=>s.getAll()),getBook=id=>tx("books","readonly",s=>s.get(id)),putBook=b=>tx("books","readwrite",s=>s.put(b));
const getFile=id=>tx("files","readonly",s=>s.get(id)),putFile=(id,b)=>tx("files","readwrite",s=>s.put(b,id));
const allWords=()=>tx("words","readonly",s=>s.getAll()),getWord=id=>tx("words","readonly",s=>s.get(id)),putWord=w=>tx("words","readwrite",s=>s.put(w)),delWord=id=>tx("words","readwrite",s=>s.delete(id));
async function delBook(id){await tx("books","readwrite",s=>s.delete(id));await tx("files","readwrite",s=>s.delete(id))}

// ================= 加書 =================
async function addEpub(blob,meta){
  const buf=await blob.arrayBuffer();
  let title=meta.title,author=meta.author,cover=meta.cover||null,lang=meta.lang||"en",score=meta.score??null;
  try{const bk=ePub(buf.slice(0));await bk.ready;const md=bk.packaging.metadata;title=title||md.title;author=author||md.creator;lang=(md.language||lang||"en").slice(0,2);
    if(!cover){const cu=await bk.coverUrl();if(cu){const cb=await (await fetch(cu)).blob();cover=await blobToDataUrl(await shrink(cb))}}
    if(score==null&&lang==="en")score=await scoreBook(bk);bk.destroy()}catch(e){console.warn("meta",e)}
  const id=meta.id||("imp-"+(title||"book").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40)+"-"+blob.size);
  const old=await getBook(id);
  await putFile(id,new Blob([buf],{type:"application/epub+zip"}));
  await putBook(Object.assign({id,title:title||"Untitled",author:author||"",source:meta.source||"import",added:Date.now(),lastRead:0,cfi:null,pct:0,locations:null},old||{},{cover:cover||(old&&old.cover)||null,lang,score,words:meta.words??(old&&old.words)??null}));
  return id;
}
async function scoreBook(bk){try{let txt="";const items=bk.spine.spineItems.slice(0,40);for(const s of items){if(txt.length>120000)break;try{const d=await s.load(bk.load.bind(bk));const el=d&&(d.body||(d.querySelector&&d.querySelector("body"))||d);txt+=" "+(el.textContent||"");s.unload()}catch(e){console.warn("score",e)}}return flesch(txt.slice(0,120000))}catch(e){return null}}
function blobToDataUrl(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
async function shrink(blob){try{const bmp=await createImageBitmap(blob);const w=300,h=Math.round(bmp.height*w/bmp.width);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);return await new Promise(r=>c.toBlob(r,"image/jpeg",.82))}catch(e){return blob}}

  for(const f of fs){try{if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){await addEpub(await pdfToEpub(f),{source:"pdf",title:f.name.replace(/\.pdf$/i,"").replace(/[_-]+/g," ")})}else await addEpub(f,{source:"import"});n++}catch(err){toast(t("importFail",f.name),4000)}}
  if(n){toast(t("imported",n));showView("vShelf")}};

// 網址匯入：先直接抓，被 CORS 擋就換公開代理；支援 EPUB / PDF / TXT / 網頁(HTML)
function fixUrl(u){u=u.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;let m;
  if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/))return`https://drive.google.com/uc?export=download&id=${m[1]}`;
  if(/dropbox\.com\//.test(u))return u.replace(/^https?:\/\/(www\.)?dropbox\.com/,"https://dl.dropboxusercontent.com").replace(/[?&]dl=0/,"");
  if(m=u.match(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/blob\/(.+)$/))return`https://raw.githubusercontent.com/${m[1]}/${m[2]}`;
  if(m=u.match(/^https:\/\/(\w+)\.(?:m\.)?wikipedia\.org\/wiki\/([^?#]+)/))return`https://${m[1]}.wikipedia.org/api/rest_v1/page/html/${m[2]}`;
  if(m=u.match(/gutenberg\.org\/ebooks\/(\d+)\/?$/))return`https://www.gutenberg.org/ebooks/${m[1]}.epub3.images`;
  return u}
const PROXIES=[u=>u,u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
async function fetchAny(url){let last;for(const px of PROXIES){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),45000);
  const r=await fetch(px(url),{signal:ctl.signal});clearTimeout(tm);if(!r.ok){last=new Error(r.status);continue}
  const buf=await r.arrayBuffer();if(buf.byteLength<20){last=new Error("empty");continue}return{buf,ct:(r.headers.get("content-type")||"").toLowerCase()}}catch(e){last=e}}throw last}
$("importUrlBtn").onclick=async()=>{
  let url=prompt(t("urlPrompt"));if(!url||!url.trim())return;url=fixUrl(url);
  toast(t("importing",1),60000);
  try{
    const{buf,ct}=await fetchAny(url);const h=new Uint8Array(buf.slice(0,5));
    const name=decodeURIComponent(url.split("/").pop().split("?")[0]||"");
    const title=(name.replace(/\.(epub3?|pdf|txt|html?)(\.images)?$/i,"")||"").replace(/[_-]+/g," ")||new URL(url).hostname;
    if(h[0]===0x25&&h[1]===0x50&&h[2]===0x44&&h[3]===0x46){await addEpub(await pdfToEpub(new File([buf],name||"book.pdf",{type:"application/pdf"})),{source:"url",title})}
    else if(h[0]===0x50&&h[1]===0x4B){await addEpub(new Blob([buf],{type:"application/epub+zip"}),{source:"url",title})}
    else{
      const txt=new TextDecoder().decode(buf);
      if(/^\s*<(!doctype|html|\?xml|head|body)/i.test(txt)||ct.includes("html")){
        const doc=new DOMParser().parseFromString(txt,"text/html");
        const ttl=(doc.querySelector("meta[property='og:title']")||{}).content||doc.title||title;
        const main=doc.querySelector("article")||doc.querySelector("main")||doc.body;
        main.querySelectorAll("nav,header,footer,aside,form,iframe,noscript,button,[role=navigation]").forEach(n=>n.remove());
        const{chapters,images}=htmlChapters("<html><body>"+main.innerHTML+"</body></html>",url);
        if(!chapters.length||main.textContent.trim().length<200)throw new Error("no text");

// PDF → 抽文字 → 組成可重新排版的 EPUB（掃描 PDF 沒有文字就會失敗）
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function pdfToEpub(file){
  const V="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if(!window.pdfjsLib){await loadScript(V+"pdf.min.js");pdfjsLib.GlobalWorkerOptions.workerSrc=V+"pdf.worker.min.js"}
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let meta={};try{meta=(await pdf.getMetadata()).info||{}}catch(e){}
  const pages=[];let chars=0;
  for(let n=1;n<=pdf.numPages;n++){
    const pg=await pdf.getPage(n);const tc=await pg.getTextContent();
    const lines=[];let cur=null;
    for(const it of tc.items){if(!("str" in it))continue;const y=Math.round(it.transform[5]);const h=Math.abs(it.transform[3])||it.height||10;
      if(!cur||Math.abs(cur.y-y)>h*0.5){cur={y,h,x:it.transform[4],t:""};lines.push(cur)}cur.t+=(cur.t&&!cur.t.endsWith(" ")&&it.str&&!it.str.startsWith(" ")&&it.transform[4]-cur.x>2?"":"")+it.str;}
    // 行 → 段落：行距明顯變大或上一行以句號結尾且較短，就換段
    const gaps=[];for(let i=1;i<lines.length;i++)gaps.push(lines[i-1].y-lines[i].y);const med=gaps.filter(g=>g>0).sort((a,b)=>a-b)[Math.floor(gaps.length/2)]||14;
    const maxLen=Math.max(...lines.map(l=>l.t.trim().length),1);
    const paras=[];let p="";
    lines.forEach((l,i)=>{const tx=l.t.replace(/\s+/g," ").trim();if(!tx)return;
      if(/^\d{1,4}$/.test(tx)&&(i===0||i===lines.length-1))return; // 頁碼
      const gap=i?lines[i-1].y-l.y:0;const prevShort=p&&lines[i-1]&&lines[i-1].t.trim().length<maxLen*0.7&&/[.!?:"”’]$/.test(p);
      if(p&&(gap>med*1.5||prevShort)){paras.push(p);p=""}
      p=p?(p.endsWith("-")&&/^[a-z]/.test(tx)?p.slice(0,-1)+tx:p+" "+tx):tx});
    if(p)paras.push(p);chars+=paras.join("").length;pages.push(paras);
  }
  if(chars<200)throw new Error("no text");
  const per=Math.max(1,Math.round(8));const chapters=[];
  for(let i=0;i<pages.length;i+=per){const ps=pages.slice(i,i+per).flat();chapters.push({title:`p. ${i+1}–${Math.min(i+per,pages.length)}`,xhtml:ps.map(x=>`<p>${esc(x)}</p>`).join("\n")})}
  return buildEpub({title:meta.Title||file.name.replace(/\.pdf$/i,""),author:meta.Author||"",lang:"en",chapters,images:[],cover:null});
}

// Gutenberg（GITenberg 鏡像）→ 在瀏覽器裡組成 EPUB
async function gutenbergToEpub(it){
  const raw=`https://raw.githubusercontent.com/${it.repo}/${it.branch}/`;const id=it.gid;
  let meta={};try{meta=await (await fetch(raw+"metadata.json")).json()}catch(e){}
  const title=it.title||meta.title,author=it.author||cleanAuthor(meta.author||"");
  let chapters=null,images=[];
  for(const f of[`${id}-h/${id}-h.htm`,`${id}-h/${id}-h.html`,`${id}-h.htm`]){
    const r=await fetch(raw+f);if(!r.ok)continue;
    const html=await r.text();const base=raw+f.replace(/[^/]+$/,"");
    ({chapters,images}=htmlChapters(html,base));if(chapters.length)break;
  }
  if(!chapters||!chapters.length){
    for(const f of[`${id}-0.txt`,`${id}.txt`,`${id}-8.txt`]){const r=await fetch(raw+f);if(!r.ok)continue;
      let txt;if(f.endsWith("-8.txt")){txt=new TextDecoder("iso-8859-1").decode(await r.arrayBuffer())}else txt=await r.text();
      chapters=txtChapters(txt);if(chapters.length)break}
  }
  if(!chapters||!chapters.length)throw new Error("no content");
  let cover=null;try{const r=await fetch(raw+"cover.jpg");if(r.ok)cover=await r.blob()}catch(e){}
  return buildEpub({title,author:author.trim(),lang:meta.lang||"en",chapters,images,cover});
}
function stripPG(s){const a=s.search(/\*\*\*\s*START OF (THIS|THE) PROJECT GUTENBERG[^*]*\*\*\*/i);const b=s.search(/\*\*\*\s*END OF (THIS|THE) PROJECT GUTENBERG/i);
  if(a>=0){s=s.slice(s.indexOf("***",a+3)+3)}if(b>=0){const bb=s.search(/\*\*\*\s*END OF (THIS|THE) PROJECT GUTENBERG/i);if(bb>=0)s=s.slice(0,bb)}return s}
function htmlChapters(html,base){
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("script,style,link,meta,#pg-header,#pg-footer,section.pg-boilerplate,.pg-boilerplate").forEach(n=>n.remove());
  // 移除 Gutenberg 開頭結尾的授權文字
  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let startNode=null,endNode=null,n;
  while(n=walker.nextNode()){if(!startNode&&/\*\*\*\s*START OF (THIS|THE) PROJECT GUTENBERG/i.test(n.data))startNode=n;if(/\*\*\*\s*END OF (THIS|THE) PROJECT GUTENBERG/i.test(n.data))endNode=n}
  const top=el=>{while(el.parentNode&&el.parentNode!==doc.body)el=el.parentNode;return el};
  if(startNode){let el=top(startNode);while(el.previousSibling)el.previousSibling.remove();el.remove()}
  if(endNode){let el=top(endNode);while(el.nextSibling)el.nextSibling.remove();el.remove()}
  const images=[];let ic=0;
  doc.querySelectorAll("img").forEach(img=>{const src=img.getAttribute("src");if(!src||ic>=40){img.remove();return}const name=`img${ic++}${(src.match(/\.(jpe?g|png|gif)$/i)||[".jpg"])[0].toLowerCase()}`;images.push({name,url:new URL(src,base).href});img.setAttribute("src","images/"+name);img.removeAttribute("width");img.removeAttribute("height")});
  doc.querySelectorAll("a[href]").forEach(a=>{if(!/^https?:/.test(a.getAttribute("href")))a.removeAttribute("href")});
  const cnt=t=>doc.body.querySelectorAll(t).length;const head=(["H2","H3","H1","H4"].map(t=>[t,cnt(t)]).filter(x=>x[1]>=3&&x[1]<500).sort((a,b)=>b[1]-a[1])[0]||["H2"])[0];
  // 把包著章節標題的外層 div 攤平成一串區塊，再從每個標題切章
  const blocks=[];const flat=el=>{for(const k of[...el.childNodes]){if(k.nodeType===1&&k.tagName!==head&&k.querySelector&&k.querySelector(head))flat(k);else blocks.push(k)}};flat(doc.body);
  const chapters=[];let cur={title:"",nodes:[]};
  for(const k of blocks){if(k.nodeType===1&&k.tagName===head){if(cur.nodes.some(x=>x.textContent&&x.textContent.trim()))chapters.push(cur);cur={title:k.textContent.replace(/\s+/g," ").trim().slice(0,80),nodes:[k]}}else cur.nodes.push(k)}
  if(cur.nodes.some(x=>x.textContent&&x.textContent.trim()))chapters.push(cur);
  const ser=new XMLSerializer();
  return{chapters:chapters.map((c,i)=>({title:c.title||(i===0?"Start":"Section "+(i+1)),xhtml:c.nodes.map(x=>ser.serializeToString(x)).join("\n")})),images};
}
function txtChapters(txt){
  txt=stripPG(txt).replace(/\r\n/g,"\n");
  const paras=txt.split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g," ").trim()).filter(Boolean);
  const chapters=[];let cur={title:"Start",ps:[]};
  for(const p of paras){if(/^(CHAPTER|Chapter|BOOK|Book|PART|Part|STAVE|ACT)\b[\s\S]{0,60}$/.test(p)&&p.length<80){if(cur.ps.length)chapters.push(cur);cur={title:p,ps:[]}}else cur.ps.push(p)}
  if(cur.ps.length)chapters.push(cur);
  return chapters.map(c=>({title:c.title,xhtml:`<h2>${esc(c.title)}</h2>`+c.ps.map(p=>`<p>${esc(p)}</p>`).join("\n")}));
}
async function buildEpub({title,author,lang,chapters,images,cover}){
  const zip=new JSZip();zip.file("mimetype","application/epub+zip",{compression:"STORE"});
  zip.file("META-INF/container.xml",`<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);
  const x=s=>esc(s).replace(/'/g,"&apos;");const man=[],spine=[],nav=[];
  chapters.forEach((c,i)=>{const f=`c${i}.xhtml`;zip.file("OEBPS/"+f,`<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xml:lang="${lang}"><head><title>${x(c.title)}</title><style>img{max-width:100%;height:auto}h1,h2,h3{text-align:center}.pagenum,.pagenum a{display:none}</style></head><body>${c.xhtml}</body></html>`);
    man.push(`<item id="c${i}" href="${f}" media-type="application/xhtml+xml"/>`);spine.push(`<itemref idref="c${i}"/>`);nav.push(`<li><a href="${f}">${x(c.title)}</a></li>`)});
  for(const im of images){try{const r=await fetch(im.url);if(!r.ok)continue;zip.file("OEBPS/images/"+im.name,await r.blob());man.push(`<item id="${im.name.replace(/\W/g,"_")}" href="images/${im.name}" media-type="${/png$/.test(im.name)?"image/png":/gif$/.test(im.name)?"image/gif":"image/jpeg"}"/>`)}catch(e){}}
  if(cover){zip.file("OEBPS/cover.jpg",cover);man.push(`<item id="cover" href="cover.jpg" media-type="image/jpeg" properties="cover-image"/>`)}
  zip.file("OEBPS/nav.xhtml",`<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>Contents</title></head><body><nav epub:type="toc"><ol>${nav.join("")}</ol></nav></body></html>`);
  zip.file("OEBPS/content.opf",`<?xml version="1.0" encoding="utf-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="uid">shelf-${Date.now()}</dc:identifier><dc:title>${x(title)}</dc:title><dc:creator>${x(author)}</dc:creator><dc:language>${lang}</dc:language><meta property="dcterms:modified">2026-01-01T00:00:00Z</meta>${cover?'<meta name="cover" content="cover"/>':""}</metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>${man.join("")}</manifest><spine>${spine.join("")}</spine></package>`);
  return zip.generateAsync({type:"blob",mimeType:"application/epub+zip"});
}

  $("fsVal").textContent=P.fs+"px";
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle("on",fn(b)));
  on("#fontSeg button",b=>b.dataset.f===P.font);on("#lhSeg button",b=>+b.dataset.lh===P.lh);on("#mxSeg button",b=>+b.dataset.mx===P.mx);
  on("#thSeg button",b=>b.dataset.th===P.th);on("#spSeg button",b=>b.dataset.sp===P.sp);on("#tlSeg button",b=>b.dataset.tl===P.tl);
  if(resize&&R){const r=R.rendition;const loc=r.currentLocation();const cfi=loc&&loc.start&&loc.start.cfi;setTimeout(()=>{r.resize();if(cfi)r.display(cfi)},30)}
}
function onRelocated(loc){
  if(!R||!loc||!loc.start)return;const rec=R.rec;closePop();
  rec.cfi=loc.start.cfi;rec.lastRead=Date.now();
  const Lc=R.book.locations;let pct=rec.pct||0;
  if(Lc&&Lc.length&&Lc.length())pct=Lc.percentageFromCfi(loc.start.cfi)||0;
  if(loc.atEnd)pct=1;rec.pct=pct;
  const d=loc.start.displayed||{};
  $("rPos").textContent=t("chapPage",chapterName(loc.start.href),d.page,d.total)+Math.round(pct*100)+"%";
  $("rPct").textContent=Math.round(pct*100)+"%";if(!scrubbing)$("rScrub").value=Math.round(pct*1000);
  clearTimeout(onRelocated.t);onRelocated.t=setTimeout(()=>putBook(rec),400);
  markToc(loc.start.href);
}
function chapterName(href){if(!R||!R.toc)return"";const base=(href||"").split("#")[0].split("/").pop();let best="";const walk=a=>a.forEach(x=>{if(!best&&x.href&&x.href.split("#")[0].split("/").pop()===base)best=x.label.trim();x.subitems&&walk(x.subitems)});walk(R.toc);return best}
function buildToc(){if(!R||!R.toc)return;let h="";const walk=(a,dep)=>a.forEach(x=>{h+=`<a href="#" class="${dep?"sub":""}" data-href="${esc(x.href)}">${esc(x.label.trim())}</a>`;x.subitems&&dep<1&&walk(x.subitems,dep+1)});walk(R.toc,0);$("tocPanel").innerHTML=h||`<p>${t("noToc")}</p>`}
function markToc(href){const base=(href||"").split("#")[0].split("/").pop();let first=null;document.querySelectorAll("#tocPanel a").forEach(a=>{const on=!first&&a.dataset.href.split("#")[0].split("/").pop()===base;if(on)first=a;a.classList.toggle("cur",on)})}
$("tocPanel").addEventListener("click",e=>{const a=e.target.closest("[data-href]");if(!a)return;e.preventDefault();R.rendition.display(a.dataset.href);closePanels();$("reader").classList.remove("ui")});

const next=()=>{closePop();R&&R.rendition.next()},prev=()=>{closePop();R&&R.rendition.prev()};
$("zl").onclick=()=>{closePanels();prev()};$("zr").onclick=()=>{closePanels();next()};
function onKey(e){if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")next();else if(e.key==="ArrowLeft"||e.key==="PageUp")prev()}
document.addEventListener("keydown",e=>{if(!R||$("reader").hidden||e.target.tagName==="INPUT")return;if(e.key==="Escape"){if(!$("pop").hidden)closePop();else closeReader();return}onKey(e)});

// 點字查詢、滑動翻頁、長按選取翻譯
function wireContent(c){
  const doc=c.document,win=c.window;let sx=0,sy=0,st=0,moved=false;
  doc.addEventListener("touchstart",e=>{const p=e.changedTouches[0];sx=p.screenX;sy=p.screenY;st=Date.now();moved=false},{passive:true});
  doc.addEventListener("touchmove",()=>{moved=true},{passive:true});
  doc.addEventListener("touchend",e=>{const p=e.changedTouches[0];const dx=p.screenX-sx,dy=p.screenY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3&&Date.now()-st<800){if(hasSel(doc))return;dx<0?next():prev()}},{passive:true});
  doc.addEventListener("click",e=>{
    if(e.target.closest("a[href]"))return;
    if(hasSel(doc))return;
    if(!$("pop").hidden){closePop();return}
    const hit=wordAt(doc,e.clientX,e.clientY);
    if(hit){lookup(hit,c,e);return}
    togglUI();
  });
  doc.addEventListener("selectionchange",()=>{clearTimeout(win.__sel);win.__sel=setTimeout(()=>showSelBtn(doc,c),350)});
  doc.addEventListener("keydown",onKey);
}
const hasSel=d=>{const s=d.getSelection&&d.getSelection();return s&&String(s).trim().length>0};
function caretAt(doc,x,y){if(doc.caretRangeFromPoint)return doc.caretRangeFromPoint(x,y);if(doc.caretPositionFromPoint){const p=doc.caretPositionFromPoint(x,y);if(!p)return null;const r=doc.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);return r}return null}
function wordAt(doc,x,y){
  const r=caretAt(doc,x,y);if(!r)return null;const node=r.startContainer;if(!node||node.nodeType!==3)return null;
  const text=node.data;let i=r.startOffset;
  const isW=ch=>/[\p{L}\p{M}'’-]/u.test(ch);
  // 確認真的點在字上面（不是行尾空白）
  if(!isW(text[i]||"")&&isW(text[i-1]||""))i--;
  if(!isW(text[i]||""))return null;
  let a=i,b=i+1;
  const cjk=/[぀-ヿ㐀-鿿]/.test(text[i]);
  if(cjk&&window.Intl&&Intl.Segmenter){const seg=new Intl.Segmenter(R.rec.lang||"ja",{granularity:"word"});for(const s of seg.segment(text)){if(i>=s.index&&i<s.index+s.segment.length){a=s.index;b=s.index+s.segment.length;break}}}
  else{while(a>0&&isW(text[a-1]))a--;while(b<text.length&&isW(text[b]))b++;while(a<b&&/['’-]/.test(text[a]))a++;while(b>a&&/['’-]/.test(text[b-1]))b--}
  const word=text.slice(a,b);if(!word)return null;
  const range=doc.createRange();range.setStart(node,a);range.setEnd(node,b);
  const rect=range.getBoundingClientRect();if(x<rect.left-4||x>rect.right+4||y<rect.top-6||y>rect.bottom+6)return null;
  return{word,range,sentence:sentenceOf(node,a,word)};
}
function sentenceOf(node,off,word){
  let blk=node.parentElement;while(blk&&!/^(P|DIV|LI|BLOCKQUOTE|TD|H\d|SECTION|BODY)$/.test(blk.tagName))blk=blk.parentElement;
  const full=(blk||node.parentElement).textContent.replace(/\s+/g," ");
  // 找出這個字在段落中的位置
  const pre=(node.data.slice(Math.max(0,off-40),off)).replace(/\s+/g," ");let idx=full.indexOf(pre+word);idx=idx>=0?idx+pre.length:full.indexOf(word);if(idx<0)return word;
  const startRe=/[.!?。！？][”’"')\]]*\s+/g;let s=0,m;while((m=startRe.exec(full))&&m.index+m[0].length<=idx)s=m.index+m[0].length;
  const endRe=/[.!?。！？][”’"')\]]*(\s|$)/g;endRe.lastIndex=idx+word.length;const e=endRe.exec(full);
  return full.slice(s,e?e.index+e[0].trimEnd().length:full.length).trim().slice(0,400);
}
function showSelBtn(doc,c){
  const s=doc.getSelection();const txt=String(s||"").trim();const btn=$("selBtn");
  if(!txt||txt.length>300||!s.rangeCount){btn.hidden=true;return}
  const rr=s.getRangeAt(0).getBoundingClientRect();const fr=frameRect(c);
  btn.textContent=t("translate");btn.hidden=false;
  btn.style.left=Math.max(8,Math.min(innerWidth-120,fr.left+rr.left+rr.width/2-50))+"px";btn.style.top=Math.max(60,fr.top+rr.top-54)+"px";
  btn.onclick=()=>{btn.hidden=true;const range=s.getRangeAt(0).cloneRange();lookup({word:txt,range,sentence:sentenceOf(range.startContainer.nodeType===3?range.startContainer:range.startContainer.firstChild||range.startContainer,range.startOffset,txt.split(/\s+/)[0]),phrase:true},c,{clientX:rr.left+rr.width/2,clientY:rr.top});try{s.removeAllRanges()}catch(e){}};
}
function frameRect(c){const f=[...$("viewer").querySelectorAll("iframe")].find(fr=>fr.contentDocument===c.document);return f?f.getBoundingClientRect():{left:0,top:0}}
function togglUI(){const el=$("reader");if(!$("aaPanel").hidden||!$("tocPanel").hidden){closePanels();return}el.classList.toggle("ui")}
function closePanels(){$("aaPanel").hidden=true;$("tocPanel").hidden=true}

// ================= 翻譯 + 生字本 =================
let popHL=null;
function closePop(){$("pop").hidden=true;$("selBtn").hidden=true;if(popHL&&R){try{R.rendition.annotations.remove(popHL,"highlight")}catch(e){}}popHL=null}
async function gtx(q,sl,tl){const u=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl||"auto"}&tl=${tl}&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(q)}`;const r=await fetch(u);if(!r.ok)throw new Error(r.status);const d=await r.json();
  return{tr:(d[0]||[]).map(x=>x&&x[0]).filter(Boolean).join(""),alts:(d[1]||[]).map(p=>({pos:p[0],terms:(p[1]||[]).slice(0,5)})),src:d[2]}}
async function dictEn(w){try{const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w.toLowerCase())}`);if(!r.ok)return null;const d=await r.json();const e=d[0];
  const ipa=e.phonetic||(e.phonetics||[]).map(p=>p.text).find(Boolean)||"";const defs=(e.meanings||[]).slice(0,2).map(m=>({pos:m.partOfSpeech,def:(m.definitions[0]||{}).definition}));return{ipa,defs}}catch(e){return null}}
const POS={zh:{noun:"名",verb:"動",adjective:"形",adverb:"副",preposition:"介",pronoun:"代",conjunction:"連",interjection:"感"},ja:{noun:"名",verb:"動",adjective:"形",adverb:"副",preposition:"前",pronoun:"代",conjunction:"接",interjection:"感"},en:{}};
function sayWord(text,lang){try{const ss=speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==="ja"?"ja-JP":"en-US";u.rate=.9;const v=ss.getVoices().find(v=>v.lang.replace("_","-").startsWith(u.lang.slice(0,2))&&/premium|enhanced|Samantha|Ava|Kyoko|Google/i.test(v.name));if(v)u.voice=v;setTimeout(()=>ss.speak(u),ss.speaking?80:0)}catch(e){}}
async function lookup(hit,c,ev){
  if(!R)return;const pop=$("pop");const book=R.rec;const lang=book.lang||"en";
  // 標黃這個字
  try{const cfi=c.cfiFromRange(hit.range);popHL=cfi;R.rendition.annotations.highlight(cfi,{},()=>{},"epubjs-hl")}catch(e){}
  const fr=frameRect(c);const x=fr.left+ev.clientX,y=fr.top+ev.clientY;
  const word=hit.word.trim();const key=(lang+":"+word.toLowerCase()).slice(0,120);
  pop.innerHTML=`<div class="ph"><span class="w">${esc(word)}</span><span class="ipa" id="pIpa"></span></div><div class="tr" id="pTr">${t("translating")}</div><div id="pAlt"></div><div id="pDef"></div>
   <div class="sent"><span id="pSent">${esc(hit.sentence)}</span><div id="pSentTr" style="opacity:.8;margin-top:4px"></div></div>
   <div class="acts"><button id="pSay">${t("speak")}</button><button id="pSave" class="saved">${t("saved")}</button><button id="pSentBtn">${t("sentTr")}</button></div>`;
  pop.hidden=false;placePop(x,y);
  $("pSay").onclick=()=>sayWord(word,lang);
  $("pSentBtn").onclick=async()=>{$("pSentTr").textContent=t("translating");try{$("pSentTr").textContent=(await gtx(hit.sentence,lang,P.tl)).tr}catch(e){$("pSentTr").textContent=t("trFail")}placePop(x,y)};
  sayWord(word,lang);
  let w=await getWord(key);const isNew=!w;
  w=Object.assign({id:key,word,lang,tl:P.tl,added:Date.now(),lookups:0,box:0,due:Date.now(),known:false},w||{});
  w.lookups++;w.last=Date.now();w.sentence=hit.sentence;w.bookId=book.id;w.bookTitle=book.title;
  try{w.cfi=c.cfiFromRange(hit.range)}catch(e){}
  if(!isNew&&w.known){w.known=false;w.box=Math.max(0,w.box-1);w.due=Date.now()}
  $("pSave").onclick=async()=>{const ex=await getWord(key);if(ex){await delWord(key);$("pSave").textContent=t("unsaved");$("pSave").classList.remove("saved")}else{await putWord(w);$("pSave").textContent=t("saved");$("pSave").classList.add("saved")}updateBadge()};
  try{
    const[g,dic]=await Promise.all([w.tr&&w.tl===P.tl&&w.alts?Promise.resolve({tr:w.tr,alts:w.alts}):gtx(word,lang,P.tl),lang==="en"&&!hit.phrase&&!w.ipa?dictEn(word):Promise.resolve(null)]);
    if(!pop.isConnected||pop.hidden)return;
    w.tr=g.tr;w.alts=g.alts;w.tl=P.tl;if(dic){w.ipa=dic.ipa;w.defs=dic.defs}
    $("pTr").textContent=w.tr;$("pIpa").textContent=w.ipa||"";
    const pos=POS[P.ui]||{};
    $("pAlt").innerHTML=(w.alts||[]).slice(0,3).map(a=>`<div class="alt"><b>${esc(pos[a.pos]||a.pos)}</b>${esc(a.terms.join("、"))}</div>`).join("");
    $("pDef").innerHTML=(w.defs||[]).map(d=>`<div class="def"><i>${esc(d.pos)}</i> ${esc(d.def)}</div>`).join("");
  }catch(e){$("pTr").textContent=t("trFail")}
  await putWord(w);updateBadge();placePop(x,y);
}
function placePop(x,y){const pop=$("pop");const W=innerWidth,H=innerHeight;const pw=pop.offsetWidth,ph=pop.offsetHeight;
  let left=Math.max(12,Math.min(W-pw-12,x-pw/2));let top=y+28;if(top+ph>H-20)top=Math.max(12+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-t"))||0),y-ph-24);
  pop.style.left=left+"px";pop.style.top=top+"px"}
document.addEventListener("click",e=>{if(!$("pop").hidden&&!e.target.closest("#pop")&&!e.target.closest(".zone"))closePop()});

// 生字本
const BOX=[0,864e5,3*864e5,7*864e5,14*864e5,30*864e5];
let wlF="all";
document.querySelectorAll("#wlChips .chip").forEach(c=>c.onclick=()=>{wlF=c.dataset.wl;document.querySelectorAll("#wlChips .chip").forEach(x=>x.classList.toggle("on",x===c));renderWords()});
const dueWords=ws=>ws.filter(w=>!w.known&&w.due<=Date.now());
async function updateBadge(){try{const n=dueWords(await allWords()).length;const b=$("dueBadge");b.hidden=!n;b.textContent=n>99?"99+":n}catch(e){}}
function markSent(s,w){if(!s)return"";const i=s.toLowerCase().indexOf(w.toLowerCase());return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+w.length))+"</mark>"+esc(s.slice(i+w.length))}
async function renderWords(){
  if(!$("flash").hidden)return;
  let ws=(await allWords()).sort((a,b)=>(b.last||b.added)-(a.last||a.added));
  const due=dueWords(ws).length;$("reviewBtn").textContent=t("review",due);$("reviewBtn").disabled=!due;
  if(wlF==="new")ws=ws.filter(w=>!w.known);if(wlF==="known")ws=ws.filter(w=>w.known);
  $("wordsEmpty").hidden=ws.length>0;
  $("wlist").innerHTML=ws.map(w=>`<div class="wcard"><div class="wh"><span class="w">${esc(w.word)}</span><span class="ph">${esc(w.ipa||"")}</span><button class="ib" data-say="${esc(w.id)}" style="min-height:0;padding:2px 6px">🔊</button></div>
    <div class="tr">${esc(w.tr||"")}</div><div class="sen">${markSent(w.sentence,w.word)}</div>
    <div class="wf"><span class="lvl">${[0,1,2,3,4].map(i=>`<i class="${i<w.box||w.known?"on":""}"></i>`).join("")}</span><span>${esc(t("fromBook",w.bookTitle||""))}</span><span>${t("lookups",w.lookups||1)}</span>
    <button data-go="${esc(w.id)}">${t("goSource")}</button><button data-wdel="${esc(w.id)}">${t("del")}</button></div></div>`).join("");
}
$("wlist").addEventListener("click",async e=>{
  const s=e.target.closest("[data-say]");if(s){const w=await getWord(s.dataset.say);w&&sayWord(w.word,w.lang);return}
  const g=e.target.closest("[data-go]");if(g){const w=await getWord(g.dataset.go);if(w&&w.bookId)openBook(w.bookId,w.cfi);return}
  const d=e.target.closest("[data-wdel]");if(d){await delWord(d.dataset.wdel);renderWords();updateBadge()}
});
let RV=null;
$("reviewBtn").onclick=async()=>{const q=dueWords(await allWords()).sort(()=>Math.random()-.5).slice(0,30);if(!q.length)return;RV={q,i:0};$("wlist").hidden=true;$("wlChips").hidden=true;$("flash").hidden=false;$("reviewBtn").hidden=true;card()};
function card(){
  const f=$("flash");if(!RV||RV.i>=RV.q.length){f.innerHTML=`<div class="w" style="font-size:1.6rem">${t("reviewDone")}</div><div class="row"><button class="btn" id="rvEnd">${t("exitReview")}</button></div>`;$("rvEnd").onclick=endReview;updateBadge();return}
  const w=RV.q[RV.i];
  f.innerHTML=`<small style="color:var(--muted)">${t("reviewLeft",RV.q.length-RV.i)}</small><div class="w">${esc(w.word)}</div><div class="sen">${markSent(w.sentence,w.word)}</div>
   <div class="ans" id="rvAns" hidden>${esc(w.tr||"")}<div style="font-size:.9rem;font-weight:400;color:var(--muted);margin-top:6px">${esc(w.ipa||"")}</div></div>
   <div class="row" id="rvA"><button class="btn ghost" id="rvSay">🔊</button><button class="btn" id="rvShow">${t("show")}</button></div>
   <div class="row" id="rvB" hidden><button class="btn no" id="rvNo">${t("forgot")}</button><button class="btn ok" id="rvOk">${t("remember")}</button></div>
   <div class="row"><button class="btn ghost" id="rvEnd" style="font-size:.85rem;padding:8px 14px">${t("exitReview")}</button></div>`;
  $("rvSay").onclick=()=>sayWord(w.word,w.lang);$("rvEnd").onclick=endReview;
  $("rvShow").onclick=()=>{$("rvAns").hidden=false;$("rvA").hidden=true;$("rvB").hidden=false;sayWord(w.word,w.lang)};
  const grade=async ok=>{if(ok){w.box=Math.min(5,w.box+1);if(w.box>=5)w.known=true}else w.box=0;w.due=Date.now()+(ok?BOX[w.box]:0);if(!ok)RV.q.push(w);await putWord(w);RV.i++;card()};
  $("rvOk").onclick=()=>grade(true);$("rvNo").onclick=()=>grade(false);
}
function endReview(){RV=null;$("flash").hidden=true;$("wlist").hidden=false;$("wlChips").hidden=false;$("reviewBtn").hidden=false;renderWords();updateBadge()}

// 設定面板
$("rToc").onclick=()=>{$("aaPanel").hidden=true;$("tocPanel").hidden=!$("tocPanel").hidden};
$("rAa").onclick=()=>{$("tocPanel").hidden=true;$("aaPanel").hidden=!$("aaPanel").hidden};
$("fsDown").onclick=()=>{P.fs=Math.max(14,P.fs-1);savePrefs();applyPrefs()};
$("fsUp").onclick=()=>{P.fs=Math.min(40,P.fs+1);savePrefs();applyPrefs()};
document.querySelectorAll("#fontSeg button").forEach(b=>b.onclick=()=>{P.font=b.dataset.f;savePrefs();applyPrefs()});

document.querySelectorAll("#thSeg button").forEach(b=>b.onclick=()=>{P.th=b.dataset.th;savePrefs();applyPrefs(false)});

let scrubbing=false;
$("rScrub").oninput=e=>{scrubbing=true;$("rPct").textContent=Math.round(e.target.value/10)+"%"};
$("rScrub").onchange=e=>{scrubbing=false;if(!R)return;const Lc=R.book.locations;if(Lc&&Lc.length&&Lc.length())R.rendition.display(Lc.cfiFromPercentage(e.target.value/1000));else toast(t("scrubWait"))};

async function closeReader(keep){if(!R)return;closePop();clearTimeout(onRelocated.t);await putBook(R.rec);try{R.book.destroy()}catch(e){}R=null;$("viewer").innerHTML="";if(keep)return;$("reader").hidden=true;closePanels();document.documentElement.style.overflow="";document.querySelector('meta[name=theme-color]').content="#F6F1E7";refreshView()}

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
applyUI();applyPrefs(false);renderShelf();updateBadge();
